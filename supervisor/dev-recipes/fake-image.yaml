# Dev-only (MP_DEV=1 + COMFYUI_FAKE=1): image stack against app.fake_comfy.
id: fake-image
name: Fake image model (dev)
description: Solid red PNGs from a fake ComfyUI. Exercises LoRAs, jobs and the OpenAI images API.
engine: comfyui
served_name: fake-image
vram_gb: 0
capabilities: [txt2img]
start_timeout: 30
source:
  comfy_files:
    - {repo: fake/krea, file: diffusion_models/krea2_turbo_fp8_scaled.safetensors, dir: diffusion_models}
    - {repo: fake/krea, file: text_encoders/qwen3vl_4b_fp8_scaled.safetensors, dir: text_encoders}
    - {repo: fake/krea, file: vae/qwen_image_vae.safetensors, dir: vae}
workflow: {"10": {"class_type": "UNETLoader", "inputs": {"unet_name": "krea2_turbo_fp8_scaled.safetensors", "weight_dtype": "default"}}, "11": {"class_type": "CLIPLoader", "inputs": {"clip_name": "qwen3vl_4b_fp8_scaled.safetensors", "type": "krea2", "device": "default"}}, "12": {"class_type": "VAELoader", "inputs": {"vae_name": "qwen_image_vae.safetensors"}}, "6": {"class_type": "CLIPTextEncode", "inputs": {"text": "a red apple on a wooden table", "clip": ["11", 0]}}, "5": {"class_type": "EmptyLatentImage", "inputs": {"width": 1024, "height": 1024, "batch_size": 1}}, "3": {"class_type": "KSampler", "inputs": {"seed": 0, "steps": 8, "cfg": 1, "sampler_name": "euler", "scheduler": "simple", "denoise": 1, "model": ["10", 0], "positive": ["6", 0], "negative": ["13", 0], "latent_image": ["5", 0]}}, "8": {"class_type": "VAEDecode", "inputs": {"samples": ["3", 0], "vae": ["12", 0]}}, "9": {"class_type": "SaveImage", "inputs": {"filename_prefix": "krea2", "images": ["8", 0]}}, "13": {"class_type": "ConditioningZeroOut", "inputs": {"conditioning": ["6", 0]}}}
inputs:
  prompt: [{node: "6", input: text}]
  width: [{node: "5", input: width}]
  height: [{node: "5", input: height}]
  batch_size: [{node: "5", input: batch_size}]
  seed: [{node: "3", input: seed}]
  steps: [{node: "3", input: steps}]
  cfg: [{node: "3", input: cfg}]
lora_insert: {model_node: "10"}
loras:
  inkwash: {repo: fake/loras, file: loras/inkwash.safetensors, strength: 0.8, trigger: ink wash style}
  neon: {repo: fake/loras, file: loras/neon.safetensors, strength: 0.5}
params:
  loras: {type: multi, values: [inkwash, neon], default: [inkwash]}
warmup: {width: 256, height: 256, steps: 1}
