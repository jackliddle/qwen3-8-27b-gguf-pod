# Small vLLM smoke-test model: downloads in seconds, fits on any GPU.
id: qwen3-0.6b-vllm
name: Qwen3 0.6B (vLLM, test)
description: Tiny model for testing the vLLM engine end to end.
engine: vllm
source:
  hf_repo: Qwen/Qwen3-0.6B
  files: ["*.json", "*.safetensors", "*.txt", "*.model"]
served_name: qwen3-0.6b
vram_gb: 6
disk_gb: 1.5
capabilities: [chat, reasoning, tools]
params:
  ctx_size: {type: int, default: 8192}
  gpu_memory_utilization:
    type: float
    default: 0.15
    description: Fraction of total GPU memory vLLM pre-allocates (keep low to share the GPU)
  max_num_seqs: {type: int, default: 16}
extra_args: [--reasoning-parser, qwen3, --enable-auto-tool-choice, --tool-call-parser, hermes]
